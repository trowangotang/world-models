[project]
name = "worldmodels"
version = "0.1.0"
description = "Liten World Models-demo (Ha & Schmidhuber 2018) i et selvlaget 2D-miljø"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["worldmodels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
